# VortexMAE architecture with a compatibility adapter for the repository's
# VortexTransformer pathline tensors. The paper itself uses dense Cartesian
# Eulerian velocity volumes. Paper-native use also requires a dense dataset,
# dataset-level component normalization, and in_channels: 2 (stacked 2-D
# frames) or 3 (3-D velocity), in addition to input_mode: volume.
#
# The paper pretrains and fine-tunes in two separate stages.  This default uses
# `joint` so the unmodified PyflowVis trainer can learn masked velocity
# reconstruction and vortex segmentation in one run.  For the paper-style
# two-stage protocol:
#   1. set training_stage: pretrain and test_tasks.tasks: [];
#   2. train and save a checkpoint;
#   3. set training_stage: finetune and run with --model_path <checkpoint>.
model:
  # VortexMAE owns get_loss so its masked-reconstruction term reaches the
  # existing trainer. encoder_args is retained because dataset metadata is
  # injected into this mapping by readDataSetRelatedConfig().
  NAME: VortexMAE
  encoder_args:
    NAME: VortexMAE
    input_mode: pathline
    in_channels: 7
    KpathlinePerGroup: 4
    # Seed-coordinate rank ordering is stable for regular and adaptive inputs,
    # but adaptive/nonuniform seed spacing is approximated on a uniform grid.
    layout_mode: coordinate
    padding_threshold: -999.0

    # Adapter-specific normalization. The paper uses dataset-level,
    # component-wise velocity min-max; the existing loader does not expose
    # dataset statistics, so this default applies valid-point min-max per
    # sample. Padded -1000 samples are excluded.
    normalize_pathlines: true
    pathline_normalization: minmax
    normalization_eps: 0.00000001

    # Only velocity enters/reconstructs the MAE. Coordinates remain solely for
    # seed ordering; IVD/distance are deliberately not encoder inputs.
    # VortexTransformer channels are [x, y, t, IVD, distance, u, v].
    pathline_input_features: [5, 6]
    reconstruction_features: [5, 6]

    # L=16,K=256 maps to a 16^3 compatibility grid. Upsampling to at least
    # 32^3 preserves four distinct encoder scales (8^3,4^3,2^3,1^3) and makes
    # shifted windows effective. This is an adapter choice, not a paper value.
    adapter_volume_size: [32, 32, 32]
    mask_ratio: 0.25
    training_stage: joint
    reconstruction_activation: sigmoid
    mae_aux_in_eval: false

    # Paper-specified VortexMAE/Swin settings.
    patch_size: [4, 4, 4]
    depths: [2, 2, 18, 2]
    num_heads: [3, 6, 12, 24]
    # Appendix A describes zero residual blocks as the lightweight default.
    # Positive values are a generic capacity extension, not an exact replica
    # of the paper's separately reported heavy decoder.
    decoder_residual_blocks: 0

    # Implementation defaults: the paper does not disclose E, window size,
    # MLP ratio, qkv bias, dropout, attention dropout, or drop-path rate. E=66
    # is a parameter-count heuristic, not a reported paper value.
    embed_dim: 66
    window_size: [2, 2, 2]
    mlp_ratio: 4.0
    qkv_bias: true
    dropout: 0.0
    attention_dropout: 0.0
    drop_path_rate: 0.1

  # Eq. (22): alpha * BCE + beta * L2. The paper does not disclose the weights.
  criterion_args:
    NAME: VortexMAELoss
    alpha: 1.0
    beta: 1.0
    # Joint pathline-adapter default; the paper's two-stage protocol has no
    # joint auxiliary-loss weight.
    mae_weight: 0.1

random_seed: 3614
wandb: false

# The paper reports batch_size=256 on four A40 GPUs. This pathline-adapted
# implementation uses a conservative local batch and accumulation by default.
batch_size: 50
gradient_accumulate: 4
gradient_norm_clip: 1.0

# Paper training schedule: AdamW, lr=4e-4, x0.8 every 100 epochs, 2000 epochs.
lr: 0.0004
epochs: 2000
val_freq: 10
print_freq: 100
optimizer:
  NAME: adamw
  betas: [0.9, 0.99]
  weight_decay: 0.00001  # not disclosed in the paper

scheduler: step
decay_epochs: 100
decay_rate: 0.8
warmup_epochs: 0

save_model: true
save_freq: 100
save_model_path: outputModels/

dataloader:
  num_workers: 0

dataset:
  NAME: UnsteadyVastisPathlineSeg
  # Override on the command line:
  #   python train.py --config config/vortexmae.yaml --data_dir /path/to/data
  data_dir: /path/to/vortex_transformer_dataset

# Existing transforms affect only the loader's dummy field, not pathlines.
# VortexMAE performs valid-point normalization and MAE masking internally.
datatransforms:
  train: []
  val: []
  test: []
  kwargs: {}

test_tasks:
  tasks: [TestPathlineSegmentation]
