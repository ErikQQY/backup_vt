# PathlineTransformerV3 keeps V1's physics features and output contract while
# replacing KNN attention with PointTransformerV3-style serialized attention.
model:
  NAME: BaseSeg
  encoder_args:
    NAME: PathlineTransformerV3
    KpathlinePerGroup: 4
    in_channels: 7
    # PathlineGroups is filled from the dataset metadata.
    dmodel: 144
    num_encoder_layers: 3
    dropout: 0.15

    temporal_sampling_ratio: 0.5
    group_sampling_ratio: 0.625
    full_inference: false
    padding_threshold: -999.0
    gradient_regularization: 0.00001

    # PTv3 serialization.  The third coordinate is pathline time, so a scalar
    # grid size applies equally to x, y and t; use [gx, gy, gt] when their
    # physical scales differ.
    # Three blocks consume three orders per pass.  Training shuffles this
    # four-pattern pool first; evaluation deterministically uses the first 3.
    serialization_orders: [z, z-trans, hilbert, hilbert-trans]
    serialization_grid_size: 0.01
    serialization_depth: 16
    shuffle_orders: true
    # Enable during data-pipeline debugging to raise on NaN/range overflow;
    # keeping it off avoids a host synchronization in every CUDA forward.
    validate_serialization: false

    # Serialized patch attention.  144 / 6 = 24 channels per head, and patch
    # size 64 avoids the quadratic full-cloud attention matrix.  SDPA lets
    # PyTorch select its fastest available fused CUDA kernel automatically.
    patch_size: 64
    num_heads: 6
    mlp_ratio: 2.0
    qkv_bias: true
    attn_drop: 0.0
    proj_drop: 0.0
    attention_backend: sdpa

    # This is used only to propagate sampled features to unsampled pathlines;
    # V3's attention itself performs no KNN query.
    k: 16

  criterion_args:
    NAME: BCELoss

# Keep V1's schedule for an apples-to-apples comparison.
random_seed: 3614
wandb: true
batch_size: 50

lr: 0.0001
epochs: 200
val_freq: 5

optimizer:
  NAME: adamw
  weight_decay: 0.000001

scheduler: TwoStep
warmup_epochs: 60
second_lr: 0.000005

save_model: true
save_freq: 30

dataloader:
  num_workers: 0

dataset:
  NAME: UnsteadyVastisPathlineSeg
  data_dir: /home/featurize/data/trainable_mesh_seeding/

datatransforms:
  train: [MinMaxNormalization, WhiteNoise]
  val: [MinMaxNormalization, WhiteNoise]
  test: []
  kwargs:
    noiseMaginitude: 0.01

# Evaluate every pathline in the [B, K] output.
test_tasks:
  tasks: [TestPathlineSegmentation]
